[project]
name = "aisc-plugin-interface"
version = "0.5.0"
description = "Plugin interface for the AISC evaluation framework"
authors = [{ name = "Sean Blevins", email = "sean.blevins@uni.lu" }]
maintainers = [
    { name = "Université du Luxembourg" },
    { name = "Luxembourg Institute of Science and Technology (LIST)" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# The report ABI (aisc_plugin_interface.report): the contract a plugin implements to
# draw its own section of a report. Only the report engine and plugins that draw a
# section need it, so it stays out of the base install.
report = [
    "jinja2>=3.1.6",
    "markupsafe>=3.0.4",
]
# The endpoint adapters (aisc_plugin_interface.adapters.endpoint) use httpx when the
# caller makes the call. The base install stays pydantic-only.
endpoint = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisc_plugin_interface"]

[tool.hatch.build.targets.sdist]
include = ["src/aisc_plugin_interface"]

[project.scripts]
aisc-plugin-interface = "aisc_plugin_interface.cli:main"
