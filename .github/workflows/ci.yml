name: ci

on:
  push:
    branches: [pilot, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest --with pandas --with onnx --with onnxruntime python -m pytest -q -p no:cacheprovider
